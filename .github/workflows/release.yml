name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build exe
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -municode -DUNICODE -D_UNICODE src/latenzy.cpp -o build/latenzy.exe \
            -lwinhttp -liphlpapi -lshell32 -luser32 -lgdi32 -lcomctl32 -lgdiplus -luxtheme -lole32 \
            -mwindows -static -s

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\latenzy_setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: latenzy
          path: |
            build/latenzy.exe
            dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            build/latenzy.exe
          generate_release_notes: true
