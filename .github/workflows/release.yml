name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish as a release, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out release tag
        id: meta
        shell: pwsh
        run: |
          $tag = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") { $tag = $env:GITHUB_REF_NAME }
          elseif ("${{ inputs.version }}" -ne "") { $tag = "${{ inputs.version }}" }
          $ver = if ($tag) { $tag.TrimStart('v') } else { "0.0.0-dev" }
          "tag=$tag"  >> $env:GITHUB_OUTPUT
          "ver=$ver"  >> $env:GITHUB_OUTPUT
          Write-Host "tag='$tag' version='$ver'"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build exe
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -municode -DUNICODE -D_UNICODE src/latenzy.cpp -o build/latenzy.exe \
            -lwinhttp -liphlpapi -lshell32 -luser32 -lgdi32 -lcomctl32 -lgdiplus -luxtheme -lole32 \
            -mwindows -static -s

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.meta.outputs.ver }}" installer\latenzy_setup.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: latenzy
          path: |
            build/latenzy.exe
            dist/*.exe

      - name: Publish release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/*.exe
            build/latenzy.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
